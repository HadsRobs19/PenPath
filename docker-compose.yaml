version: '3.8'

services:
  # Go Fiber Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    environment:
      # Use hardcoded local DB credentials to avoid .env conflicts with Supabase
      - DB_HOST=db
      - DB_USER=penpath
      - DB_NAME=penpath
      - DB_PASSWORD=devpassword
      - DB_SSLMODE=disable
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CORS_ALLOW_ALL=true
    working_dir: /app/backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # React Web Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # "auto" enables dynamic API URL detection based on the browser's current hostname
      # This allows the app to work when accessed via any IP (Docker host, Pi, etc.)
      - VITE_API_URL=auto
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      - backend
    stdin_open: true
    tty: true

  # PostgreSQL Database (for local development)
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=penpath
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=penpath
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpath -d penpath"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  go-modules:
